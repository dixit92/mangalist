name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
        include:
          # Oldest supported Python, on one platform.
          - os: ubuntu-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  matcher-without-qt:
    # The matcher, the golden set and the data-location code must not need Qt or a display.
    name: matcher tests without PySide6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the non-GUI dependencies only
        run: pip install pytest regex platformdirs requests

      - name: Import check
        run: python -c "import sys, mangalist.matcher, mangalist.mu_match, mangalist.paths, mangalist.parsing, mangalist.headless, mangalist.store, mangalist.services.mangapixer, mangalist.inventory, mangalist.scanner, mangalist.knowledge, mangalist.states, mangalist.official_sources, mangalist.identity, mangalist.downloads, mangalist.downloads.adapter, mangalist.services.nyaa, mangalist.services.qbittorrent, mangalist.gui.downloads_backend, mangalist.gui.volumes_target, mangalist.gui.shell, mangalist.duplicates, mangalist.downloads.options, mangalist.gui.download_rules; assert 'PySide6' not in sys.modules"

      - name: Run tests
        run: >
          python -m pytest -q tests/matcher tests/golden tests/test_mu_match.py tests/test_mu_cache.py
          tests/test_paths.py tests/test_classifier.py tests/parsing tests/headless tests/store tests/services tests/inventory tests/states tests/test_phase1_integration.py tests/identity tests/downloads tests/duplicates
