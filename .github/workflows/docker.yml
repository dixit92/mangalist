name: Docker image

# Builds the Unraid / Docker image (packaging/docker/Dockerfile: the GUI in the browser via
# jlesage/baseimage-gui plus the headless runner service) on every pull request and push to main,
# then smoke-tests it: the web GUI answers over HTTPS, the app and the headless runner start.
# Nothing is published: pushing to ghcr.io/dixit92/mangalist is owner-gated and comes with a
# release (see the disabled step at the end).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: mangalist:ci
      STAMP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: >
          docker build -f packaging/docker/Dockerfile
          --build-arg DOCKER_IMAGE_VERSION="0.0.0+${STAMP_SHA::7}"
          -t "$IMAGE" .

      - name: Smoke test
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data/library/Series A"
          : > "$RUNNER_TEMP/data/library/Series A/Series A v01.cbz"
          docker run -d --name ml-ci -p 127.0.0.1:5800:5800 \
            -e USER_ID="$(id -u)" -e GROUP_ID="$(id -g)" \
            -e MANGA_LIST_ROOTS=/data/library \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" "$IMAGE"
          for _ in $(seq 1 60); do
            if curl -skf -o /dev/null https://127.0.0.1:5800/; then break; fi
            sleep 2
          done
          curl -skf https://127.0.0.1:5800/ | grep -q '<title>MangaList</title>'
          # Plain HTTP is redirected to HTTPS (SECURE_CONNECTION=1, needed for clipboard sync).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5800/ || true)" != "200"
          for _ in $(seq 1 30); do
            if docker logs ml-ci 2>&1 | grep -q 'rescan: next run'; then break; fi
            sleep 2
          done
          docker logs ml-ci 2>&1 | grep -q "headless runner; data folder /config"
          docker logs ml-ci 2>&1 | grep -q "starting service 'app'"
          test -f "$RUNNER_TEMP/config/headless-state.json"
          # The GUI process is up as the app user.
          docker exec ml-ci sh -c 'for p in /proc/[0-9]*; do tr "\0" " " < "$p/cmdline"; echo; done' \
            | grep -qx '/opt/mangalist/venv/bin/python -m manga_list '
          # A one-off rescan through the runner's CLI, as the app user (the service holds the
          # scheduler lock, so use a separate data folder).
          docker exec -u "$(id -u):$(id -g)" -e MANGA_LIST_DATA_DIR=/tmp/ci-data ml-ci \
            /opt/mangalist/venv/bin/python -m manga_list --headless --run rescan \
            | tee "$RUNNER_TEMP/rescan.txt"
          grep -q '1 series, 1 archives' "$RUNNER_TEMP/rescan.txt"
          # Graceful stop: the runner logs its shutdown.
          docker stop -t 30 ml-ci
          docker logs ml-ci 2>&1 | grep -q 'Scheduler stopped'

      - name: Container log
        if: always()
        run: docker logs ml-ci 2>&1 | tail -200 || true

      # Publishing is owner-gated and comes with a release; keep this disabled until then.
      # It would need `packages: write` on this job and a v* tag trigger.
      # - name: Publish to ghcr.io
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      #     docker tag "$IMAGE" ghcr.io/dixit92/mangalist:"${GITHUB_REF_NAME#v}"
      #     docker tag "$IMAGE" ghcr.io/dixit92/mangalist:latest
      #     docker push ghcr.io/dixit92/mangalist:"${GITHUB_REF_NAME#v}"
      #     docker push ghcr.io/dixit92/mangalist:latest
