name: Build packages

# Every push to main, every pull request and every v* tag builds all packages and uploads them as
# workflow artifacts. Only a v* tag creates the (draft) GitHub release with the packages attached.
#
# Versions: packaging/stamp_version.py - calendar versions, tag v2026.9.0 -> 2026.9.0 (needs a CHANGELOG.md
# section); anything else -> 0.0.0+<short sha>.
# Package names: MangaList-v<version>-windows-x64-setup.exe, -windows-x64.zip, -macos-arm64.dmg,
# -macos-x64.dmg, -linux-x64.AppImage, -linux-x64.tar.gz, plus SHA256SUMS.
# Not code-signed (like MangaPixer): SHA256SUMS lets users check their downloads.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.12'
  QT_QPA_PLATFORM: offscreen
  # Name non-tag builds after the branch commit (for PRs, not GitHub's temporary merge commit).
  STAMP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows:
    name: Windows x64 (installer + portable zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Stamp version
        id: ver
        run: python packaging/stamp_version.py

      - name: Build (PyInstaller onedir)
        run: |
          python packaging/make_icon.py
          pyinstaller MangaList.spec --clean --noconfirm

      - name: Smoke-test the build
        run: |
          $env:MANGALIST_DATA_DIR = "$env:RUNNER_TEMP\ml-smoke"
          $p = Start-Process -FilePath dist\MangaList\MangaList.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test exit code $($p.ExitCode)" }
          if (-not (Test-Path "$env:MANGALIST_DATA_DIR\mangalist.db")) { throw "no mangalist.db written" }

      - name: Portable zip
        run: |
          $name = '${{ steps.ver.outputs.basename }}-windows-x64'
          $stage = "package\stage\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse dist\MangaList\* $stage
          Copy-Item README.md $stage
          Copy-Item LICENSE "$stage\LICENSE.txt"
          # The marker keeps settings, cache and logs in data\ and logs\ next to MangaList.exe.
          Set-Content -Path "$stage\portable" -Encoding ascii -Value 'Portable mode: MangaList keeps its settings, cache and logs next to MangaList.exe. Delete this file to use %LOCALAPPDATA%\MangaList instead.'
          Compress-Archive -Path $stage -DestinationPath "package\$name.zip"
          Remove-Item -Recurse -Force package\stage

      - name: Installer (Inno Setup)
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" "/DAppVersionNumeric=${{ steps.ver.outputs.numeric }}" packaging\windows\MangaList.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Installer check (per-user install, upgrade keeps data, uninstall)
        run: |
          $setup = (Get-Item 'package\*-setup.exe').FullName
          $app = "$env:LOCALAPPDATA\Programs\MangaList"
          $data = "$env:LOCALAPPDATA\MangaList"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MangaList.lnk"
          function Invoke-Setup($exe) {
            $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exit code $($p.ExitCode)" }
          }
          Invoke-Setup $setup
          if (-not (Test-Path "$app\MangaList.exe")) { throw "not installed to $app" }
          if (-not (Test-Path $menu)) { throw "no Start-menu entry" }
          $p = Start-Process -FilePath "$app\MangaList.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed app smoke test exit code $($p.ExitCode)" }
          if (-not (Test-Path "$data\mangalist.db")) { throw "no per-user mangalist.db in $data" }
          Invoke-Setup $setup   # upgrade in place
          if (-not (Test-Path "$app\MangaList.exe")) { throw "app missing after upgrade" }
          if (-not (Test-Path "$data\mangalist.db")) { throw "user data lost on upgrade" }
          Invoke-Setup "$app\unins000.exe"
          # The uninstaller re-launches itself from %TEMP%: wait for it to finish removing files.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\MangaList.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\MangaList.exe") { throw "app still present after uninstall" }
          if (Test-Path $menu) { throw "Start-menu entry still present after uninstall" }
          if (-not (Test-Path "$data\mangalist.db")) { throw "uninstall removed user data" }
          Write-Host "install / upgrade / uninstall OK; user data kept in $data"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.basename }}-windows-x64
          path: |
            package/*-setup.exe
            package/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest     # Apple silicon
            arch: arm64
          - runner: macos-15-intel   # last Intel image family on GitHub-hosted runners
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Stamp version
        id: ver
        run: python packaging/stamp_version.py

      - name: Build (PyInstaller .app)
        run: |
          python packaging/make_icon.py
          pyinstaller MangaList.spec --clean --noconfirm

      - name: Smoke-test the app bundle
        run: |
          MANGALIST_DATA_DIR="$RUNNER_TEMP/ml-smoke" dist/MangaList.app/Contents/MacOS/MangaList --smoke-test
          test -f "$RUNNER_TEMP/ml-smoke/mangalist.db"

      - name: Disk image
        run: packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"

      - name: Check the disk image
        run: |
          dmg=$(ls package/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          test -L "$RUNNER_TEMP/dmg/Applications"
          "$RUNNER_TEMP/dmg/MangaList.app/Contents/MacOS/MangaList" --version
          hdiutil detach "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.basename }}-macos-${{ matrix.arch }}
          path: package/*.dmg
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64 (AppImage + tar.gz)
    # Built on the oldest supported Ubuntu: the AppImage then runs on distributions with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Qt runtime libraries and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Stamp version
        id: ver
        run: python packaging/stamp_version.py

      - name: Build (PyInstaller onedir)
        run: |
          python packaging/make_icon.py
          pyinstaller MangaList.spec --clean --noconfirm

      - name: Smoke-test the build
        run: |
          MANGALIST_DATA_DIR="$RUNNER_TEMP/ml-smoke" dist/MangaList/MangaList --smoke-test
          test -f "$RUNNER_TEMP/ml-smoke/mangalist.db"

      - name: AppImage and tar.gz
        run: packaging/linux/build_packages.sh "${{ steps.ver.outputs.version }}"

      - name: Check the packages
        run: |
          MANGALIST_DATA_DIR="$RUNNER_TEMP/ml-smoke-appimage" ./package/*.AppImage --appimage-extract-and-run --smoke-test
          test -f "$RUNNER_TEMP/ml-smoke-appimage/mangalist.db"
          tar -tzf package/*.tar.gz | grep -q '/MangaList$'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.basename }}-linux-x64
          path: |
            package/*.AppImage
            package/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA256SUMS
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        run: python3 packaging/stamp_version.py --dry-run

      - uses: actions/download-artifact@v8
        with:
          pattern: MangaList-v*
          path: package
          merge-multiple: true

      - name: Check names and write SHA256SUMS
        working-directory: package
        run: |
          base='${{ steps.ver.outputs.basename }}'
          for f in "$base-windows-x64-setup.exe" "$base-windows-x64.zip" "$base-macos-arm64.dmg" \
                   "$base-macos-x64.dmg" "$base-linux-x64.AppImage" "$base-linux-x64.tar.gz"; do
            test -s "$f" || { echo "missing package: $f"; exit 1; }
          done
          sha256sum MangaList-v* > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: python3 packaging/stamp_version.py --dry-run --release-notes "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: package
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: package/*
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
